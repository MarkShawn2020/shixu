name: Check Expo app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22.13
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor

      - name: Bundle iOS app
        run: npx expo export --platform ios
