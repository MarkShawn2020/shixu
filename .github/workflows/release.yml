name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "待发布的 Git 标签，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Use Node.js 22.13
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Test document detection
        run: npm run test:detection

      - name: Expo Doctor
        run: npm run doctor

      - name: Export iOS bundle
        run: npx expo export --platform ios

      - name: Package release asset
        id: asset
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          ASSET="shixu-${RELEASE_TAG}.zip"
          zip -r "$ASSET" dist
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          awk -v ver="$RELEASE_VERSION" '
            /^## / {
              if (found) exit
              if ($2 == ver) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "拾序 v${RELEASE_VERSION}" > release-notes.md
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.asset.outputs.name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RELEASE_ASSET" "${RELEASE_ASSET}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "拾序 ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_ASSET" "${RELEASE_ASSET}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "拾序 ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
